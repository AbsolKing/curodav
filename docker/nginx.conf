server {
    listen 80;
    server_name curodav.absolking.com;

    location / {
        proxy_pass http://curodav:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_header_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
