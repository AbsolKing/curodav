services:
  radicale:
    image: tomsquest/docker-radicale
    restart: unless-stopped
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - radicale-data:/data
      - ./docker/radicale/config:/config/config:ro
      - ./docker/radicale/htpasswd:/config/htpasswd:ro
    read_only: true
    security_opt:
      - no-new-privileges:true

  curodav:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      CC_RADICALE_URL: "http://radicale:5232/curodav/"
      CC_RADICALE_USER: curodav
      CC_RADICALE_PASSWORD: changeme
      CC_DEPLOY_MODE: production
    volumes:
      - curodav-data:/app/data
    depends_on:
      - radicale

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - curodav

volumes:
  radicale-data:
  curodav-data:
